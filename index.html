<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Invoice — Gallery Cahaya Mandiri</title>

<!-- jsPDF + autotable, buat generate PDF invoice di browser -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
  :root{
    --navy: #0E2A47;
    --navy-deep: #081A2E;
    --magenta: #C41E5A;
    --magenta-soft: #E8305F;
    --bg: #F3F5F8;
    --panel: #FFFFFF;
    --line: #E1E6EC;
    --ink: #16233A;
    --ink-soft: #5B6B84;
    --ok: #1E8E5A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  /* ---------- Header ---------- */
  header{
    position:relative;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:#fff;
    padding: 34px 24px 40px;
    overflow:hidden;
  }
  header .compass{
    position:absolute;
    right:-40px; top:-40px;
    width:220px; height:220px;
    opacity:0.10;
  }
  header .brand{
    position:relative;
    z-index:1;
    max-width:760px;
    margin:0 auto;
  }
  header .brand-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  header .compass-mark{
    width:38px; height:38px;
    flex-shrink:0;
  }
  header h1{
    margin:0;
    font-size: 22px;
    letter-spacing: 0.5px;
    font-weight:700;
  }
  header p{
    margin: 6px 0 0 50px;
    color: #B9C6DA;
    font-size: 13px;
  }
  header .strip{
    position:absolute;
    left:0; right:0; bottom:0;
    height:5px;
    background: linear-gradient(90deg, var(--magenta) 0%, var(--magenta-soft) 40%, transparent 100%);
  }

  /* ---------- Layout ---------- */
  main{
    max-width: 760px;
    margin: -22px auto 60px;
    padding: 0 16px;
    position:relative;
    z-index:2;
  }
  .card{
    background: var(--panel);
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(14,42,71,0.08);
    padding: 22px 20px;
    margin-bottom: 18px;
    border: 1px solid var(--line);
  }
  .card h2{
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--magenta);
    margin: 0 0 16px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h2::before{
    content:"";
    width:5px; height:16px;
    background: var(--magenta);
    border-radius: 3px;
    display:inline-block;
  }

  .field{ margin-bottom: 14px; }
  .field label{
    display:block;
    font-size: 12.5px;
    font-weight:600;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .field input, .field textarea, .field select{
    width:100%;
    padding: 10px 12px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    font-size: 14.5px;
    color: var(--ink);
    background:#FAFBFC;
    font-family: inherit;
    transition: border-color .15s, background .15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none;
    border-color: var(--navy);
    background:#fff;
  }
  .field textarea{ resize: vertical; min-height: 60px; }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width:520px){ .row2{ grid-template-columns: 1fr; } }

  /* ---------- Item rows ---------- */
  .item-row{
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 14px 14px 6px;
    margin-bottom: 12px;
    background: #FAFBFC;
    position: relative;
  }
  .item-row .item-grid{
    display:grid;
    grid-template-columns: 2fr 1fr 1fr 1.3fr;
    gap: 10px;
  }
  @media (max-width:600px){ .item-row .item-grid{ grid-template-columns: 1fr 1fr; } }
  .item-row .subtotal-line{
    margin-top: 10px;
    text-align:right;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .item-row .subtotal-line b{ color: var(--navy); }
  .remove-btn{
    position:absolute;
    top:8px; right:8px;
    background:none;
    border:none;
    color:#B5442E;
    font-size: 18px;
    line-height:1;
    cursor:pointer;
    padding:4px 8px;
    border-radius:6px;
  }
  .remove-btn:hover{ background:#FBE7E3; }

  .add-item-btn{
    width:100%;
    padding: 11px;
    border: 1.5px dashed var(--navy);
    background: #EFF3F8;
    color: var(--navy);
    border-radius: 8px;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    margin-top: 4px;
  }
  .add-item-btn:hover{ background:#E4EAF2; }

  /* ---------- Summary ---------- */
  .summary-line{
    display:flex;
    justify-content: space-between;
    padding: 8px 0;
    font-size: 14px;
    border-bottom: 1px dashed var(--line);
  }
  .summary-line:last-child{ border-bottom:none; }
  .summary-line.total{
    font-weight:700;
    font-size: 16px;
    color: var(--navy);
  }
  .summary-line.sisa{
    font-weight:700;
    color: var(--magenta);
  }

  .submit-btn{
    width:100%;
    padding: 15px;
    border:none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--magenta) 0%, var(--magenta-soft) 100%);
    color:#fff;
    font-size: 15.5px;
    font-weight:700;
    letter-spacing:0.3px;
    cursor:pointer;
    box-shadow: 0 6px 18px rgba(196,30,90,0.28);
  }
  .submit-btn:active{ transform: translateY(1px); }
  .submit-btn:disabled{ opacity:0.6; cursor:not-allowed; }

  .status-msg{
    text-align:center;
    font-size: 13.5px;
    margin-top: 12px;
    min-height: 18px;
  }
  .status-msg.ok{ color: var(--ok); font-weight:600; }
  .status-msg.err{ color:#B5442E; font-weight:600; }

  footer{
    text-align:center;
    font-size: 11.5px;
    color: var(--ink-soft);
    padding: 10px 16px 30px;
  }
</style>
</head>
<body>

<header>
  <svg class="compass" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="46" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="34" fill="none" stroke="white" stroke-width="1"/>
    <polygon points="50,8 55,50 50,92 45,50" fill="white"/>
    <polygon points="8,50 50,45 92,50 50,55" fill="white"/>
  </svg>
  <div class="brand">
    <div class="brand-row">
      <svg class="compass-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="46" fill="none" stroke="#E8305F" stroke-width="4"/>
        <polygon points="50,14 58,50 50,86 42,50" fill="#fff"/>
        <polygon points="14,50 50,42 86,50 50,58" fill="#fff"/>
        <circle cx="50" cy="50" r="5" fill="#E8305F"/>
      </svg>
      <h1>GALLERY CAHAYA MANDIRI</h1>
    </div>
    <p>Form Input Invoice — otomatis buat nomor &amp; PDF</p>
  </div>
  <div class="strip"></div>
</header>

<main>
  <form id="invoiceForm">

    <div class="card">
      <h2>Data Pelanggan</h2>
      <div class="field">
        <label for="nama">Nama</label>
        <input type="text" id="nama" required placeholder="Nama pelanggan / PT">
      </div>
      <div class="field">
        <label for="alamat">Alamat</label>
        <textarea id="alamat" required placeholder="Alamat lengkap"></textarea>
      </div>
      <div class="field">
        <label for="noTlp">No. Telepon</label>
        <input type="tel" id="noTlp" required placeholder="08xxxxxxxxxx">
      </div>
    </div>

    <div class="card">
      <h2>Data Barang</h2>
      <div id="itemsContainer"></div>
      <button type="button" class="add-item-btn" id="addItemBtn">+ Tambah Barang</button>
    </div>

    <div class="card">
      <h2>Pembayaran</h2>
      <div class="field">
        <label for="dp">DP (Uang Muka)</label>
        <input type="number" id="dp" min="0" value="0" placeholder="0">
      </div>
      <div class="summary-line"><span>Subtotal</span><span id="sumSubtotal">Rp 0</span></div>
      <div class="summary-line total"><span>Total</span><span id="sumTotal">Rp 0</span></div>
      <div class="summary-line"><span>DP</span><span id="sumDp">Rp 0</span></div>
      <div class="summary-line sisa"><span>Sisa Bayar</span><span id="sumSisa">Rp 0</span></div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">Buat Invoice &amp; Download PDF</button>
    <div class="status-msg" id="statusMsg"></div>
  </form>
</main>

<footer>Gallery Cahaya Mandiri — Sistem Input Invoice</footer>

<script>
/* ============================================================
   KONFIGURASI — GANTI BAGIAN INI SESUAI PUNYA LU
   ============================================================ */
const CONFIG = {
  // Ganti dengan URL Web App hasil deploy Apps Script (lihat Code.gs yang gue kasih terpisah)
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbzV6S_j2Dzyy1QjsEGl5Z1x7gTU1UVlK2Ul93fhTQsqobPdPPjgcBFzHSBwcd4fZlzAUA/exec",

  // Data perusahaan buat kop invoice PDF — sesuaikan
  COMPANY_NAME: "GALLERY CAHAYA MANDIRI",
  COMPANY_ADDRESS: "Alamat perusahaan lu di sini, Surabaya",
  COMPANY_PHONE: "08xx-xxxx-xxxx",

  COLOR_NAVY: [14, 42, 71],
  COLOR_MAGENTA: [196, 30, 90],
};

/* ============================================================
   STATE
   ============================================================ */
let itemCount = 0;

function formatRupiah(num) {
  return "Rp " + Math.round(num).toLocaleString("id-ID");
}

function addItemRow(prefill) {
  itemCount++;
  const id = itemCount;
  const container = document.getElementById("itemsContainer");
  const div = document.createElement("div");
  div.className = "item-row";
  div.dataset.id = id;
  div.innerHTML = `
    <button type="button" class="remove-btn" onclick="removeItemRow(${id})">&times;</button>
    <div class="item-grid">
      <div class="field" style="margin-bottom:0;">
        <label>Nama Barang</label>
        <input type="text" class="f-nama-barang" required placeholder="Nama barang">
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Satuan</label>
        <input type="text" class="f-satuan" required placeholder="pcs / unit / set">
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Jumlah</label>
        <input type="number" class="f-jumlah" min="0" step="any" required placeholder="0" oninput="recalc()">
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Harga Satuan</label>
        <input type="number" class="f-harga" min="0" step="any" required placeholder="0" oninput="recalc()">
      </div>
    </div>
    <div class="subtotal-line">Subtotal: <b class="f-subtotal">Rp 0</b></div>
  `;
  container.appendChild(div);
  recalc();
}

function removeItemRow(id) {
  const rows = document.querySelectorAll(".item-row");
  if (rows.length <= 1) {
    alert("Minimal harus ada 1 barang.");
    return;
  }
  document.querySelector(`.item-row[data-id="${id}"]`).remove();
  recalc();
}

function getItems() {
  const rows = document.querySelectorAll(".item-row");
  const items = [];
  rows.forEach(row => {
    const namaBarang = row.querySelector(".f-nama-barang").value.trim();
    const satuan = row.querySelector(".f-satuan").value.trim();
    const jumlah = parseFloat(row.querySelector(".f-jumlah").value) || 0;
    const harga = parseFloat(row.querySelector(".f-harga").value) || 0;
    const subtotal = jumlah * harga;
    row.querySelector(".f-subtotal").textContent = formatRupiah(subtotal);
    items.push({ namaBarang, satuan, jumlah, harga, subtotal });
  });
  return items;
}

function recalc() {
  const items = getItems();
  const subtotal = items.reduce((s, i) => s + i.subtotal, 0);
  const dp = parseFloat(document.getElementById("dp").value) || 0;
  const total = subtotal;
  const sisa = total - dp;

  document.getElementById("sumSubtotal").textContent = formatRupiah(subtotal);
  document.getElementById("sumTotal").textContent = formatRupiah(total);
  document.getElementById("sumDp").textContent = formatRupiah(dp);
  document.getElementById("sumSisa").textContent = formatRupiah(sisa);
}

document.getElementById("dp").addEventListener("input", recalc);
document.getElementById("addItemBtn").addEventListener("click", () => addItemRow());

/* ============================================================
   NOMOR INVOICE OTOMATIS
   Format: 5 digit random + tanggal(2 digit) + tahun(2 digit terakhir)
   Contoh: 12345-1826  ->  tanggal 18, tahun 2026
   ============================================================ */
function generateInvoiceNumber(date) {
  const random5 = Math.floor(10000 + Math.random() * 90000);
  const day = String(date.getDate()).padStart(2, "0");
  const year2 = String(date.getFullYear()).slice(-2);
  return `${random5}-${day}${year2}`;
}

function formatTanggalIndo(date) {
  const bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  return `${date.getDate()} ${bulan[date.getMonth()]} ${date.getFullYear()}`;
}

/* ============================================================
   GENERATE PDF
   ============================================================ */
function generatePDF(data) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const navy = CONFIG.COLOR_NAVY;
  const magenta = CONFIG.COLOR_MAGENTA;

  // Kop
  doc.setFillColor(...navy);
  doc.rect(0, 0, 210, 32, "F");
  doc.setFillColor(...magenta);
  doc.rect(0, 32, 210, 2, "F");

  doc.setTextColor(255, 255, 255);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(16);
  doc.text(CONFIG.COMPANY_NAME, 14, 14);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.text(CONFIG.COMPANY_ADDRESS, 14, 20);
  doc.text("Telp: " + CONFIG.COMPANY_PHONE, 14, 25);

  doc.setFont("helvetica", "bold");
  doc.setFontSize(20);
  doc.text("INVOICE", 196, 16, { align: "right" });
  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  doc.text("No: " + data.invoiceNo, 196, 23, { align: "right" });
  doc.text(data.tanggalFormatted, 196, 28, { align: "right" });

  // Bill to
  doc.setTextColor(...navy);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(10);
  doc.text("KEPADA:", 14, 42);
  doc.setFont("helvetica", "normal");
  doc.setTextColor(30, 30, 30);
  doc.setFontSize(10);
  doc.text(data.nama, 14, 48);
  const alamatLines = doc.splitTextToSize(data.alamat, 100);
  doc.text(alamatLines, 14, 53);
  doc.text("Telp: " + data.noTlp, 14, 53 + alamatLines.length * 5);

  // Table
  const tableStartY = 53 + alamatLines.length * 5 + 10;
  const rows = data.items.map((it, idx) => [
    idx + 1,
    it.namaBarang,
    it.satuan,
    it.jumlah,
    formatRupiah(it.harga),
    formatRupiah(it.subtotal),
  ]);

  doc.autoTable({
    startY: tableStartY,
    head: [["No", "Nama Barang", "Satuan", "Jumlah", "Harga Satuan", "Subtotal"]],
    body: rows,
    theme: "grid",
    headStyles: { fillColor: navy, textColor: 255, fontStyle: "bold", fontSize: 9 },
    bodyStyles: { fontSize: 9, textColor: [30, 30, 30] },
    columnStyles: {
      0: { cellWidth: 10, halign: "center" },
      3: { halign: "right" },
      4: { halign: "right" },
      5: { halign: "right" },
    },
  });

  let y = doc.lastAutoTable.finalY + 8;

  // Summary box
  const boxX = 130;
  doc.setFontSize(10);
  doc.setTextColor(30, 30, 30);
  doc.text("Total", boxX, y);
  doc.text(formatRupiah(data.total), 196, y, { align: "right" });
  y += 6;
  doc.text("DP", boxX, y);
  doc.text(formatRupiah(data.dp), 196, y, { align: "right" });
  y += 6;
  doc.setDrawColor(...magenta);
  doc.line(boxX, y - 3, 196, y - 3);
  doc.setFont("helvetica", "bold");
  doc.setTextColor(...magenta);
  doc.text("Sisa Bayar", boxX, y + 2);
  doc.text(formatRupiah(data.sisa), 196, y + 2, { align: "right" });

  // Footer
  doc.setFont("helvetica", "normal");
  doc.setTextColor(120, 120, 120);
  doc.setFontSize(8.5);
  doc.text("Invoice ini sah tanpa tanda tangan basah.", 14, 280);
  doc.text(CONFIG.COMPANY_NAME + " — Terima kasih atas kepercayaan Anda.", 14, 285);

  doc.save(`Invoice-${data.invoiceNo}.pdf`);
}

/* ============================================================
   KIRIM KE GOOGLE SHEETS (Apps Script Web App)
   ============================================================ */
async function sendToSheet(data) {
  if (!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL.startsWith("GANTI_")) {
    console.warn("APPS_SCRIPT_URL belum di-set, skip kirim ke sheet.");
    return;
  }
  await fetch(CONFIG.APPS_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(data),
  });
  // mode "no-cors" artinya kita nggak bisa baca response-nya,
  // tapi data tetap terkirim & tersimpan ke sheet.
}

/* ============================================================
   SUBMIT
   ============================================================ */
document.getElementById("invoiceForm").addEventListener("submit", async function (e) {
  e.preventDefault();

  const items = getItems();
  const hasEmptyItem = items.some(i => !i.namaBarang || !i.satuan || i.jumlah <= 0 || i.harga <= 0);
  if (hasEmptyItem) {
    alert("Lengkapi semua data barang (nama, satuan, jumlah, harga harus terisi & lebih dari 0).");
    return;
  }

  const submitBtn = document.getElementById("submitBtn");
  const statusMsg = document.getElementById("statusMsg");
  submitBtn.disabled = true;
  submitBtn.textContent = "Memproses...";
  statusMsg.className = "status-msg";
  statusMsg.textContent = "";

  const now = new Date();
  const invoiceNo = generateInvoiceNumber(now);
  const subtotal = items.reduce((s, i) => s + i.subtotal, 0);
  const dp = parseFloat(document.getElementById("dp").value) || 0;
  const total = subtotal;
  const sisa = total - dp;

  const data = {
    invoiceNo,
    tanggal: now.toISOString(),
    tanggalFormatted: formatTanggalIndo(now),
    nama: document.getElementById("nama").value.trim(),
    alamat: document.getElementById("alamat").value.trim(),
    noTlp: document.getElementById("noTlp").value.trim(),
    items,
    subtotal,
    dp,
    total,
    sisa,
  };

  try {
    await sendToSheet(data);
    generatePDF(data);
    statusMsg.className = "status-msg ok";
    statusMsg.textContent = `Invoice ${invoiceNo} berhasil dibuat & PDF sudah ke-download.`;
    document.getElementById("invoiceForm").reset();
    document.getElementById("itemsContainer").innerHTML = "";
    itemCount = 0;
    addItemRow();
    recalc();
  } catch (err) {
    console.error(err);
    statusMsg.className = "status-msg err";
    statusMsg.textContent = "Gagal memproses invoice. Coba lagi ya.";
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Buat Invoice & Download PDF";
  }
});

// Init: 1 baris barang di awal
addItemRow();
</script>

</body>
</html>
