<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Input Data Invoice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Input Data Order</h2>
        <form id="invoiceForm">
            <input type="text" id="nama" placeholder="Nama" required>
            <input type="text" id="alamat" placeholder="Alamat" required>
            <input type="text" id="no_tlp" placeholder="No Tlp" required>
            <input type="text" id="nama_barang" placeholder="Nama Barang" required>
            <input type="text" id="satuan" placeholder="Satuan" required>
            <input type="number" id="jumlah" placeholder="Jumlah" required>
            <input type="number" id="harga" placeholder="Harga" required>
            <input type="number" id="dp" placeholder="DP" required>
            <button type="submit">Generate Invoice</button>
        </form>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
