<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GCM Invoice Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f3f5;font-family:Arial,sans-serif;color:#111}
.wrap{max-width:1050px;margin:28px auto;padding:0 16px}.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 8px 28px #0001}
h1{margin:0 0 5px;font-size:24px}.sub{color:#667085;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input,textarea{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:9px;font:inherit}textarea{min-height:70px;resize:vertical}
.full{grid-column:1/-1}.items{margin-top:18px;border-top:1px solid #eaecf0;padding-top:18px}
.item{display:grid;grid-template-columns:minmax(0,2.2fr) .7fr .7fr 1fr auto;gap:8px;align-items:end;margin-bottom:9px}
.item textarea{min-height:48px}.remove{height:40px;background:#fee4e2;color:#b42318;border:0;border-radius:8px;padding:0 12px}
button{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.add{background:#eaecf0}.primary{background:#111827;color:#fff}.secondary{background:#e4e7ec}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.hint{font-size:12px;color:#667085;margin-top:10px}
@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{grid-template-columns:1fr 1fr}.item .name{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>GCM — Invoice Generator</h1>
<div class="sub">Input data → Download PDF. Layout PDF memakai invoice referensi sebagai template.</div>

<div class="grid">
<div><label>Tanggal</label><input id="date" type="date"></div>
<div><label>No. Invoice</label><input id="inv" readonly></div>
<div><label>Nama / Kepada</label><input id="customer" placeholder="PT ASIA INTI LESTARI"></div>
<div><label>No. Telepon</label><input id="phone" placeholder="08xxxxxxxxxx"></div>
<div class="full"><label>Alamat</label><textarea id="address" placeholder="Alamat pelanggan"></textarea></div>
</div>

<div class="items"><label>Barang</label><div id="rows"></div>
<button class="add" onclick="addRow()">+ Tambah Barang</button></div>

<div class="grid" style="margin-top:18px">
<div><label>DP (Down Payment)</label><input id="dp" type="number" min="0" value="0"></div>
<div><label>Keterangan</label><input id="note" value="(BELUM TERMASUK BIAYA ONGKIR DAN PPN)"></div>
</div>

<div class="actions"><button class="primary" onclick="makePDF()">Download PDF Invoice</button><button class="secondary" onclick="resetAll()">Reset</button></div>
<div class="hint">Format nomor invoice: 5 angka random + DDYY. Contoh 12345-1826 = tanggal 18, tahun 2026.</div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const {jsPDF}=window.jspdf;
const template="invoice-template.png";
const pad=n=>String(n).padStart(2,'0');
const money=n=>'Rp '+new Intl.NumberFormat('id-ID',{maximumFractionDigits:0}).format(Number(n)||0);
function invNo(){const d=new Date(document.getElementById('date').value+'T00:00:00');return String(Math.floor(Math.random()*100000)).padStart(5,'0')+'-'+pad(d.getDate())+String(d.getFullYear()).slice(-2)}
function refreshInv(){document.getElementById('inv').value=invNo()}
document.getElementById('date').valueAsDate=new Date();refreshInv();
document.getElementById('date').addEventListener('change',refreshInv);

function addRow(v={}){
 const e=document.createElement('div');e.className='item';
 e.innerHTML=`<div class="name"><label>Nama Barang</label><textarea class="namev" placeholder="Nama barang">${v.name||''}</textarea></div>
 <div><label>Jumlah</label><input class="qty" type="number" min="0" value="${v.qty??1}"></div>
 <div><label>Satuan</label><input class="unit" value="${v.unit||'SET'}"></div>
 <div><label>Harga</label><input class="price" type="number" min="0" value="${v.price||0}"></div>
 <button class="remove" onclick="this.parentElement.remove()">Hapus</button>`;
 document.getElementById('rows').appendChild(e);
}
addRow();

function words(n){
 n=Math.floor(Number(n)||0);
 const a=['','SATU','DUA','TIGA','EMPAT','LIMA','ENAM','TUJUH','DELAPAN','SEMBILAN','SEPULUH','SEBELAS'];
 if(n<12)return a[n]; if(n<20)return words(n-10)+' BELAS'; if(n<100)return words(Math.floor(n/10))+' PULUH '+words(n%10);
 if(n<200)return 'SERATUS '+words(n-100); if(n<1000)return words(Math.floor(n/100))+' RATUS '+words(n%100);
 if(n<2000)return 'SERIBU '+words(n-1000); if(n<1000000)return words(Math.floor(n/1000))+' RIBU '+words(n%1000);
 if(n<1000000000)return words(Math.floor(n/1000000))+' JUTA '+words(n%1000000);
 if(n<1000000000000)return words(Math.floor(n/1000000000))+' MILIAR '+words(n%1000000000);
 return words(Math.floor(n/1000000000000))+' TRILIUN '+words(n%1000000000000);
}
const months=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function text(doc,s,x,y,size=7,opt={}){
 doc.setFont('helvetica',opt.bold?'bold':'normal');doc.setFontSize(size);doc.setTextColor(...(opt.color||[0,0,0]));
 doc.text(String(s||''),x,y,opt.align?{align:opt.align}:undefined);
}
function makePDF(){
 const d=new Date(document.getElementById('date').value+'T00:00:00');
 const customer=document.getElementById('customer').value.trim()||'-';
 const address=document.getElementById('address').value.trim()||'-';
 const phone=document.getElementById('phone').value.trim()||'-';
 const inv=document.getElementById('inv').value;
 const dp=Number(document.getElementById('dp').value)||0;
 const note=document.getElementById('note').value||'';
 const rows=[...document.querySelectorAll('.item')].map(e=>({
   name:e.querySelector('.namev').value.trim()||'-',
   qty:Number(e.querySelector('.qty').value)||0,
   unit:e.querySelector('.unit').value.trim()||'-',
   price:Number(e.querySelector('.price').value)||0
 })).map(r=>({...r,total:r.qty*r.price}));
 const total=rows.reduce((a,r)=>a+r.total,0), grand=Math.max(0,total-dp);

 const doc=new jsPDF({unit:'mm',format:'letter'});
 doc.addImage(template,'PNG',0,0,215.9,279.4);

 // Conversion from source template pixels (918x1188) to letter mm.
 const sx=215.9/918, sy=279.4/1188;
 const X=p=>p*sx, Y=p=>p*sy;

 // Dynamic header/customer fields.
 text(doc,`${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`,X(743),Y(296),7.0);
 const cLines=doc.splitTextToSize(customer,72*sx*2.5);
 text(doc,cLines[0]||'-',X(737),Y(318),7.0,{bold:true});
 if(cLines[1]) text(doc,cLines[1],X(751),Y(337),7.0,{bold:true});
 text(doc,address,X(755),Y(369),7.0);
 text(doc,phone,X(781),Y(405),7.0);
 text(doc,inv,X(326),Y(402),7.0,{bold:true});

 // Table: exact template area reconstructed over the masked sample row.
 const left=118,right=807,top=447,bottom=785;
 const cols=[118,160,475,515,717,807];
 const rowH=27;
 // Clear body again to ensure clean rows.
 doc.setFillColor(255,255,255);doc.rect(X(left),Y(top),X(right-left),Y(bottom-top),'F');
 doc.setDrawColor(0);doc.setLineWidth(.35);
 doc.rect(X(left),Y(425),X(right-left),Y(bottom-425));
 for(const c of cols.slice(1,-1))doc.line(X(c),Y(425),X(c),Y(bottom));
 doc.line(X(left),Y(447),X(right),Y(447));
 for(let y=474;y<bottom;y+=rowH)doc.line(X(left),Y(y),X(right),Y(y));

 rows.slice(0,11).forEach((r,i)=>{
   const yy=468+i*rowH;
   text(doc,i+1,X(139),Y(yy),6.4,{align:'center'});
   const nm=doc.splitTextToSize(r.name, (475-165)*sx);
   text(doc,nm[0]||'-',X(170),Y(yy),6.3);
   if(nm[1]) text(doc,nm[1],X(170),Y(yy+10),6.3);
   text(doc,r.qty,X(495),Y(yy),6.3,{align:'center'});
   text(doc,r.unit,X(535),Y(yy),6.3,{align:'center'});
   text(doc,money(r.price),X(708),Y(yy),6.3,{align:'right'});
   text(doc,money(r.total),X(798),Y(yy),6.3,{align:'right'});
 });

 // Totals — retain original labels/artwork from template, replace values.
 text(doc,money(dp),X(805),Y(810),7.0,{align:'right'});
 text(doc,money(grand),X(805),Y(832),7.0,{align:'right',bold:true});
 text(doc,words(grand)+' RUPIAH',X(380),Y(891),6.7,{color:[24,82,145]});
 text(doc,note,X(459),Y(849),6.1,{align:'center'});

 doc.save(`Invoice-${inv}.pdf`);
}
function resetAll(){
 document.getElementById('customer').value='';
 document.getElementById('phone').value='';
 document.getElementById('address').value='';
 document.getElementById('dp').value=0;
 document.getElementById('note').value='(BELUM TERMASUK BIAYA ONGKIR DAN PPN)';
 document.getElementById('rows').innerHTML='';addRow();
 document.getElementById('date').valueAsDate=new Date();refreshInv();
}
</script>
</body>
</html>
